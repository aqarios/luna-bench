[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-bench"
version = "0.2.1"
description = "Benchmarking framework for classical, hybrid and quantum optimization algorithms"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "Llewellyn Hochhauser", email = "llewellyn.hochhauser@aqarios.com" },
    { name = "Maximilian Janetschek", email = "maximilian.janetschek@aqarios.com" },
    { name = "Jonas Blenninger", email = "jonas.blenninger@aqarios.com" },
]
maintainers = [
    { name = "Aqarios GmbH", email = "support@aqarios.com" }
]
keywords = [
    "aqarios",
    "luna",
    "quantum computing",
    "quantum optimization",
    "optimization",
    "benchmarking",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cloudpickle>=3.1.2",
    "dependency-injector>=4.48.2",
    "huey>=3.3.4",
    "ipykernel>=7.3.0",
    "luna-model>=0.6.15",
    "luna-quantum>=1.2.3",
    "peewee>=4.3.0",
    "pydantic-settings>=2.15.0",
    "returns[compatible-mypy]>=0.29.0",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://aqarios.com"
Documentation = "https://docs.aqarios.com/luna-bench/intro"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.0.260204",
    "networkx>=3.6.1",
    "pyscipopt>=6.2.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-env >=1.6.0",
    "ruff>=0.16.1",
    "scipy-stubs>=1.17.0.2",
    "tox>=4.56.4",
    "types-networkx>=3.6.1.20260210",
    "types-peewee>=4.3.0.20260807",
    "types-seaborn>=0.13.2.20260728",
    "pyscipopt>=6.2.1",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "networkx>=3.6.1",
    "scipy>=1.18.0",
    "pip-licenses>=5.5.5",
]

[project.optional-dependencies]
pre-defined = [
    "networkx>=3.6.1",
    "scipy>=1.17.0",
    "pyscipopt>=6.0.1",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.0",
]

[tool.setuptools.packages.find]
include = ["luna_bench*"]
