name: "PR Code Analysis"
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-test:
    name: "Lint & Test (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          # Only one version here: this is just the interpreter that drives the job.
          # Multi-version coverage comes from tox (py313 + py314) and from the mypy
          # loop below, both of which run inside this single leg.
          - "3.13"

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6

      - name: "Install Python"
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: "Install the project"
        run: uv sync --all-extras --all-groups

      - name: "Ruff (Linter)"
        run: uv run ruff check --config ruff.toml

      - name: "Ruff (Formater)"
        run: uv run ruff format --check --config ruff.toml

      # Type checking is the one check that differs per interpreter version, so it
      # runs against every version in requires-python. The test suite gets its
      # multi-version coverage from tox below; ruff and the build do not depend on
      # the running interpreter.
      - name: "Mypy (Type checking)"
        run: |
          for target in 3.13 3.14; do
            echo "::group::mypy --python-version $target"
            # Close the log group even when mypy fails, otherwise `bash -e` exits
            # here and the type errors stay collapsed and unreadable in the log.
            uv run mypy --config-file .mypy.ini --python-version "$target" ./ && rc=0 || rc=$?
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || exit "$rc"
          done

      # The built-in components carry a generated __init__ so IDEs can show their
      # options; it has to stay in sync with the pydantic fields. See issue #259.
      - name: "Component __init__ signatures"
        run: uv run python scripts/type_hints.py --check

      - name: "Run tox"
        run: uv run tox run-parallel

      - name: Run Pytest
        run: |
          uv run pytest --junitxml=pytest.xml --cov-config=.coveragerc --cov=luna_bench --cov-report=term-missing:skip-covered tests/unit | tee pytest-coverage.txt
      - name: Pytest coverage comment
        if: always()
        id: coverageComment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          title: Luna-Bench coverage
          badge-title: Coverage
          hide-badge: false
          hide-report: false
          create-new-comment: false
          hide-comment: false
          report-only-changed-files: false
          remove-link-from-badge: false
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
      - name: Fail if coverage is below 98%
        run: uv run coverage report --fail-under=98
